const weeklyDone = (tasks) => { const t0 = today(); return tasks.filter((t) => t.status === 'done' && t.completed_at && daysBetween(iso(new Date(t.completed_at)), t0) >= 0 && daysBetween(iso(new Date(t.completed_at)), t0) < 7).length; };
function recommendations({ subjects, tasks, exams, decks }) {
  const t0 = today(), recs = [];
  const over = tasks.filter((t) => t.status === 'pending' && t.due_date && t.due_date < t0).length;
  if (over) recs.push([over === 1 ? 'Tienes 1 tarea vencida' : `Tienes ${over} tareas vencidas`, 'Termínalas o muévelas de fecha.', '#/tasks']);
  const soon = exams.filter((e) => { const d = daysBetween(t0, e.exam_date); return d >= 0 && d <= 7; }).sort((a, b) => a.exam_date.localeCompare(b.exam_date))[0];
  if (soon) { const hasDeck = soon.subject_id && decks.some((d) => d.subject_id === soon.subject_id); if (!hasDeck) { const d = daysBetween(t0, soon.exam_date); recs.push([`“${soon.title}” es ${d === 0 ? 'hoy' : d === 1 ? 'mañana' : `en ${d} días`}`, 'No tienes tarjetas de esa materia. Crea un mazo para repasar.', '#/study/cards']); } }
  if (!subjects.length) recs.push(['Agrega tus materias', 'Organiza tareas, exámenes y tarjetas por materia.', '#/study/subjects']);
  return recs.slice(0, 3);
}

ACTS.sdStart = (el) => { const acc = (c) => (c.times_reviewed ? c.times_correct / c.times_reviewed : -1); S.sd = { id: el.dataset.id, queue: [...S.deckCards].sort((a, b) => acc(a) - acc(b)), pos: 0, flip: false, known: 0 }; render(); };
ACTS.sdFlip = () => { S.sd.flip = !S.sd.flip; render(); };
ACTS.sdExit = () => { S.sd = null; render(); };
ACTS.sdAns = async (el) => { const ok = el.dataset.ok === '1', c = S.sd.queue[S.sd.pos]; try { await A.decks.review(c, ok); } catch (e) { return toast(friendly(e), 'err'); } if (ok) S.sd.known++; S.sd.flip = false; S.sd.pos++; render(); };

/* ---------- GAME: levels, feedback, final exam ---------- */
VIEWS.game = async ([id]) => {
  if (!S.g || S.g.id !== id) S.g = { id, mode: 'path' };
  if (!S.gc || S.gc.id !== id || S.gc.stale) { const [quiz, questions, attempts] = await Promise.all([A.quizzes.get(id), A.quizzes.questions(id), A.quizzes.attempts()]); S.gc = { id, quiz, questions, attempts: attempts.filter((a) => a.quiz_id === id) }; }
  const G = S.g, { quiz, questions, attempts } = S.gc, p = gprog(questions.length, attempts);
  if (G.mode === 'play') {
    const q = G.items[G.idx], ok = G.picked === q.correct_index, mk = getMascotKind(), hide = G.hide || [];
    const mood = !G.checked ? 'idle' : ok ? (G.streak >= 3 ? 'celebrate' : 'happy') : 'sad';
    const line = !G.checked ? say(G.idx === 0 ? 'start' : 'idle', G.idx) : ok ? say(G.streak >= 2 ? 'combo' : 'right', G.idx) : say('wrong', G.idx);
    return `<div class="row"><button class="ib" aria-label="Salir del nivel" data-act="gExit">${ico('x', 22, 'var(--muted)')}</button><div class="grow">${bar((G.idx + (G.checked ? 1 : 0)) / G.items.length, 'var(--ok)')}</div><span class="small muted">${G.idx + 1}/${G.items.length}</span></div>
    <div class="mrow">${mascotBtn(mk, mood, 72)}<div class="bubble">${esc(line)}${comboLabel(G.streak) ? ` <span class="pill">${comboLabel(G.streak)}</span>` : ''}</div></div>
    <h1 style="font-size:22px">${esc(q.prompt)}</h1><div class="col">${q.options.map((o, i) => { let c = 'opt'; if (G.checked && i === q.correct_index) c += ' right'; else if (G.checked && i === G.picked && !ok) c += ' wrong'; else if (i === G.picked) c += ' sel'; const gone = hide.includes(i); if (gone) c += ' gone'; return `<button class="${c}" data-act="gPick" data-i="${i}" ${G.checked || gone ? 'disabled' : ''}>${esc(o)}${gone ? ' <span class="small">(descartada)</span>' : ''}</button>`; }).join('')}</div>
    ${!G.checked && G.hints > 0 && q.options.length >= 3 ? `<button class="btn ghost sm" data-act="gHint">${ico('bulb', 16, 'var(--brand)')}Pista: descartar opciones (${G.hints})</button>` : ''}
    ${G.checked ? `<div class="fb ${ok ? 'ok' : 'no'}" role="status"><div class="row">${ico(ok ? 'check' : 'x', 22, ok ? 'var(--ok)' : 'var(--bad)', 3)}<h2>${ok ? '¡Correcto!' : 'Casi'}</h2></div>${!ok ? `<div>Respuesta correcta: ${esc(q.options[q.correct_index])}</div>` : ''}${q.explanation ? `<div class="small">${esc(q.explanation)}</div>` : ''}<button class="btn" data-act="gNext">${G.idx + 1 < G.items.length ? 'Continuar' : 'Terminar'}</button></div>` : `<button class="btn" data-act="gCheck" ${G.picked === null ? 'disabled' : ''}>Comprobar</button>`}`;
  }
  if (G.mode === 'done') {
    const pct = Math.round(G.score / G.total * 100), passed = G.score / G.total >= PASS;
    if (G.level === 0) { const m = mastMsg(pct), weak = [...Array(p.L).keys()].map((i) => i + 1).filter((l) => (p.b.get(l) ?? 0) < 0.8); return card(`${mascot(getMascotKind(), 'celebrate', 110)}<div class="bubble">${esc(say('final', pct))}</div>${ico('trophy', 36, 'var(--brand)')}<h1>${m[0]}</h1>${ring(pct / 100, pct + '%', 120)}<div>Dominas el ${pct}% de “${esc(quiz.title)}”.</div><div class="small muted">${m[1]}</div><div class="small muted">Acertaste ${G.score} de ${G.total} · +${xpFor(G.score, G.total)} XP</div>${weak.length ? `<div class="small muted">Para mejorar, repite los niveles: ${weak.join(', ')}.</div>` : ''}<button class="btn" data-act="gBack">Volver al camino</button><button class="btn sec" data-act="gStart" data-l="0">Intentar el examen otra vez</button>`, 'center'); }
    return card(`${mascot(getMascotKind(), passed ? 'celebrate' : 'sad', 110)}<div class="bubble">${esc(say(passed ? 'pass' : 'fail', G.level))}</div>${G.best >= 2 ? `<div class="small muted">Mejor combo: x${G.best}</div>` : ''}<div class="badge ${passed ? 'okb' : 'nob'}">${ico(passed ? 'check' : 'x', 36, passed ? 'var(--ok)' : 'var(--bad)', 3)}</div><h1>${passed ? `¡Nivel ${G.level} completado!` : 'Inténtalo de nuevo'}</h1><div>Acertaste ${G.score} de ${G.total} (${pct}%)</div><div class="small muted">+${xpFor(G.score, G.total)} XP${!passed ? ` · Necesitas ${Math.ceil(G.total * PASS)} aciertos para avanzar` : ''}</div><button class="btn" data-act="${passed ? 'gBack' : 'gStart'}" data-l="${G.level}">${passed ? 'Continuar' : 'Reintentar'}</button>${!passed ? '<button class="btn sec" data-act="gBack">Volver al camino</button>' : ''}`, 'center');
  }
  const OFF = [0, 52, 0, -52]; let nodes = '';
  for (let l = 1; l <= p.L; l++) { const done = l <= p.c, open = l <= p.c + 1; nodes += `<div class="nodew" style="transform:translateX(${OFF[(l - 1) % 4]}px)"><button class="node ${done ? 'done' : open ? 'cur' : 'lock'}" ${open ? '' : 'disabled'} data-act="gStart" data-l="${l}" aria-label="Nivel ${l}${done ? ', completado' : open ? '' : ', bloqueado'}">${done ? ico('check', 30, '#fff', 3) : open ? l : ico('lock', 26)}</button>${p.b.has(l) ? `<span class="small muted">${Math.round(p.b.get(l) * 100)}%</span>` : ''}</div>`; }
  return `<div class="row between"><a class="btn ghost sm" href="#/study/games">Volver</a><a class="btn ghost sm" href="#/quizedit/${esc(id)}">Editar preguntas</a></div><h1>${esc(quiz.title)}</h1>`
    + (questions.length ? card(`<div class="mrow">${mascotBtn(getMascotKind(), p.c > 0 ? 'happy' : 'wave', 88)}<div class="bubble">${esc(p.c >= p.L && p.L > 0 ? '¡Ya puedes hacer el examen final!' : say('start', p.c))}</div></div><div class="chips" role="radiogroup" aria-label="Tu compañero de estudio">${Object.entries(MASCOTS).map(([k, m]) => `<button class="chip" role="radio" aria-checked="${getMascotKind() === k}" aria-selected="${getMascotKind() === k}" data-act="mascot" data-k="${k}" title="${esc(m.kind)}">${esc(m.name)}</button>`).join('')}</div>`) + card(`<div class="row between"><strong>Tu avance</strong><span class="small muted">${p.c} de ${p.L} niveles</span></div>${bar(p.ratio)}<div class="small muted">${p.mastery === null ? 'Completa niveles para saber cuánto dominas.' : `Dominio actual: ${p.mastery}%${p.fb === null ? ' (aún sin examen final)' : ''}`}</div>`) + `<div class="path">${nodes}<div class="nodew"><button class="node fin ${p.finalUnlocked ? 'cur' : 'lock'}" ${p.finalUnlocked ? '' : 'disabled'} data-act="gStart" data-l="0" aria-label="Examen final${p.finalUnlocked ? '' : ', bloqueado'}">${ico(p.finalUnlocked ? 'trophy' : 'lock', 36)}</button><span class="small muted">Examen final${p.fb !== null ? ` · ${Math.round(p.fb * 100)}%` : ''}</span></div></div>` : card(empty('quiz', 'Este juego no tiene preguntas', 'Agrega preguntas o crea un juego desde tus apuntes.', `<a class="btn sm" href="#/quizedit/${esc(id)}">Editar preguntas</a>`)));
};
ACTS.gStart = (el) => { const l = Number(el.dataset.l), qs = S.gc.questions; const items = l === 0 ? shuffle(qs).slice(0, FINALN) : qs.slice((l - 1) * QPL, l * QPL); if (!items.length) return; Object.assign(S.g, { mode: 'play', level: l, items, idx: 0, picked: null, checked: false, correct: 0, hints: 1, streak: 0, best: 0, hide: [] }); render(); };
ACTS.gPick = (el) => { if (!S.g.checked) { S.g.picked = Number(el.dataset.i); render(); } };
ACTS.gCheck = () => { const G = S.g; if (G.picked === null) return; G.checked = true; if (G.picked === G.items[G.idx].correct_index) { G.correct++; G.streak++; G.best = Math.max(G.best || 0, G.streak); } else G.streak = 0; render(); };
ACTS.gHint = () => { const G = S.g; if (G.checked || !(G.hints > 0)) return; const q = G.items[G.idx], h = hintHide(q); if (!h.length) return; G.hide = h; G.hints--; if (h.includes(G.picked)) G.picked = null; render(); };
ACTS.pet = (el) => { const svg = el.querySelector('.mascot'), b = el.closest('.mrow')?.querySelector('.bubble'); if (!svg) return; PET = (PET + 1) % 997; if (b) b.textContent = say('poke', PET); svg.classList.remove('pet'); void svg.getBoundingClientRect(); svg.classList.add('pet'); };
let PET = 0;
ACTS.mascot = (el) => { setMascotKind(el.dataset.k); render(); };
ACTS.gNext = async () => { const G = S.g; if (G.idx + 1 < G.items.length) { G.idx++; G.picked = null; G.checked = false; G.hide = []; return render(); } try { await A.quizzes.saveAttempt(G.id, G.correct, G.items.length, G.level); } catch (e) { toast(friendly(e), 'err'); } S.gc.stale = true; Object.assign(G, { mode: 'done', score: G.correct, total: G.items.length }); render(); if (G.level === 0 || G.correct / G.items.length >= PASS) confetti(); };
ACTS.gExit = async () => { if (await confirmDlg('Si sales ahora perderás el avance de este nivel.', 'Salir')) { S.g.mode = 'path'; render(); } };
ACTS.gBack = () => { S.g.mode = 'path'; render(); };

/* ---------- QUIZ EDIT ---------- */

};

  onSubmit: async (fd) => { const prompt = (fd.get('prompt') || '').trim(), all = [0, 1, 2, 3].map((i) => (fd.get('o' + i) || '').trim()), ci = Number(fd.get('ci')); const options = all.filter(Boolean); if (!prompt) return 'Escribe la pregunta.'; if (options.length < 2) return 'Agrega al menos 2 opciones.'; if (!all[ci]) return 'La respuesta correcta no puede estar vacía.'; if (new Set(options).size !== options.length) return 'Las opciones no pueden repetirse.';
    await A.quizzes.saveQuestion({ id: q?.id, quiz_id: S.editQuiz, prompt, options, correct_index: options.indexOf(all[ci]), position: q?.position ?? S.editQs.length }); S.gc = null; toast(q ? 'Pregunta actualizada' : 'Pregunta agregada'); render(); } }); }

/* ---------- NOTES (photos/files) + AI game ---------- */
S.nsel = new Set(); S.nsub = null;

  <div class="row wrap"><label class="btn grow">${ico('camera', 18, '#fff')}Tomar foto<input type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden data-file="note"></label><label class="btn sec grow">${ico('image', 18)}Galería<input type="file" accept="image/jpeg,image/png,image/webp" hidden data-file="note"></label><label class="btn sec grow">${ico('file', 18)}Archivo<input type="file" accept="application/pdf,text/plain,image/jpeg,image/png,image/webp" hidden data-file="note"></label></div>
  ${subjects.length ? `<div class="col"><div class="small muted">Materia para lo que subas</div><div class="chips"><button class="chip" aria-pressed="${!S.nsub}" data-act="nsub" data-v="">Todas</button>${subjects.map((s) => `<button class="chip" aria-pressed="${S.nsub === s.id}" data-act="nsub" data-v="${esc(s.id)}">${esc(s.name)}</button>`).join('')}</div></div>` : ''}

/* ---------- TUTOR (Profe Flow) ---------- */
S.chat = { msgs: [], files: [], busy: false, problem: null };
VIEWS.tutor = async () => {

  <div class="chatbar"><div id="chatfiles" class="chips"></div><div class="row g4"><label class="ib" aria-label="Tomar foto">${ico('camera', 20, 'var(--brand)')}<input type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden data-file="chat"></label><label class="ib" aria-label="Elegir foto">${ico('image', 20, 'var(--brand)')}<input type="file" accept="image/jpeg,image/png,image/webp" hidden data-file="chat"></label><label class="ib" aria-label="Adjuntar archivo">${ico('file', 20, 'var(--brand)')}<input type="file" accept="application/pdf,text/plain" hidden data-file="chat"></label><textarea id="chatin" rows="1" maxlength="2000" placeholder="Escribe tu pregunta…" aria-label="Escribe tu pregunta"></textarea><button class="btn" data-act="chatSend">${ico('send', 16, '#fff')}Enviar</button></div></div>
  <div class="small muted">${CONFIG.TUTOR} puede equivocarse. Verifica lo importante con tu libro o tu maestro. Tus archivos se envían al servicio de IA solo para responderte; no subas datos personales.</div>`;
};
function renderChat() {

    + (busy ? '<div class="muted" role="status">Pensando…</div>' : '') + (problem ? `<div class="card errc" role="alert">${esc(problem)}</div>` : '');
  $('#chatfiles').innerHTML = files.map((f) => `<span class="chip" aria-pressed="true">${esc(f.title)} <button class="ib sm" aria-label="Quitar ${esc(f.title)}" data-act="chatRm" data-id="${esc(f.id)}">${ico('x', 12)}</button></span>`).join('');
  c.scrollTop = c.scrollHeight; window.scrollTo(0, document.body.scrollHeight);
}

ACTS.chatRm = (el) => { S.chat.files = S.chat.files.filter((f) => f.id !== el.dataset.id); renderChat(); };
ACTS.chatSend = async () => {

  ${forgot ? '' : `<div class="seg" role="tablist"><button type="button" role="tab" aria-selected="${!reg}" data-act="authMode" data-v="login">Iniciar sesión</button><button type="button" role="tab" aria-selected="${reg}" data-act="authMode" data-v="register">Crear cuenta</button></div>`}
  <form id="authform" novalidate>${reg ? '<label>Nombre<input name="name" autocomplete="name" maxlength="80" placeholder="Tu nombre"></label>' : ''}<label>Correo<input name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" placeholder="tucorreo@ejemplo.com"></label>
  ${forgot ? '' : `<label>Contraseña<div class="pwrow"><input id="pw" name="pw" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" placeholder="${reg ? 'Mínimo 10 caracteres' : 'Tu contraseña'}"><button type="button" class="ib" data-act="togglePw" aria-label="Mostrar contraseña">${ico('eye', 18)}</button></div>${reg ? '<div class="meter" aria-hidden="true"><i id="meter"></i></div><span class="small muted" id="meterl">Mínimo 10 caracteres, con letras y números.</span>' : ''}</label>`}
  ${reg ? `<label class="row sw"><input type="checkbox" name="ok"><span class="small">Acepto los <a href="#/legal/terms" target="_blank" rel="noopener">términos</a>, el <a href="#/legal/privacy" target="_blank" rel="noopener">aviso de privacidad</a> y la <a href="#/legal/refunds" target="_blank" rel="noopener">política de cancelación y reembolsos</a>, y soy mayor de edad o tengo permiso de mi mamá, papá o tutor.</span></label>` : ''}
  <div class="${kind === 'ok' ? 'okt' : 'derr'}" role="alert" id="authmsg">${esc(msg)}</div><button class="btn lg" id="authgo">${forgot ? 'Enviar enlace' : reg ? 'Crear cuenta' : 'Entrar'}</button>
  ${!reg && !forgot ? '<button type="button" class="btn ghost sm" data-act="authMode" data-v="forgot">¿Olvidaste tu contraseña?</button>' : ''}${forgot ? '<button type="button" class="btn ghost sm" data-act="authMode" data-v="login">Volver a iniciar sesión</button>' : ''}</form></div>
  <details class="only-m benefits"><summary>¿Por qué StudyFlow MX?</summary>${BENEFITS.map(([i, t, b]) => `<div class="row top g12">${ico(i, 20, 'var(--brand)')}<div><strong>${t}</strong><div class="small muted">${b}</div></div></div>`).join('')}</details>
  <footer class="small muted center authfoot"><a href="#/legal/terms">Términos</a> · <a href="#/legal/privacy">Privacidad</a> · <a href="#/legal/refunds">Cancelación y reembolsos</a> · <a href="#/legal/ai">Reglas de IA</a></footer></main></div>`;
  $('#authform').addEventListener('submit', (e) => { e.preventDefault(); authSubmit(mode, new FormData(e.target)); });
  if (reg) $('#pw').addEventListener('input', (e) => { const v = e.target.value, sc = (v.length >= 10 ? 1 : 0) + (/[a-zA-Z]/.test(v) && /[0-9]/.test(v) ? 1 : 0) + (v.length >= 14 || /[^a-zA-Z0-9]/.test(v) ? 1 : 0); const m = $('#meter'); m.style.width = v ? `${Math.max(1, sc) * 33.3}%` : '0'; m.className = sc >= 3 ? 's3' : sc === 2 ? 's2' : 's1'; $('#meterl').textContent = !v ? 'Mínimo 10 caracteres, con letras y números.' : sc >= 3 ? 'Contraseña fuerte' : sc === 2 ? 'Aceptable: añade más caracteres' : 'Débil'; });
  if (S.providers === undefined) { S.providers = null; loadProviders().then((p) => { S.providers = p; renderSocial(); }); } else renderSocial();
}
ACTS.authMode = (el) => showAuth(el.dataset.v);
async function authSubmit(mode, fd) {
  const email = (fd.get('email') || '').trim(), pw = fd.get('pw') || '', msg = (m, k) => { const n = $('#authmsg'); n.textContent = m; n.className = k === 'ok' ? 'okt' : 'derr'; }, btn = $('#authgo'), label = btn.textContent;
  if (!/^\S+@\S+\.\S+$/.test(email)) return msg('Escribe un correo válido.');
  const redirectTo = location.origin + location.pathname;
  btn.disabled = true; btn.textContent = mode === 'login' ? 'Entrando…' : mode === 'register' ? 'Creando cuenta…' : 'Enviando…';
  try {
    if (mode === 'forgot') { await sb.auth.resetPasswordForEmail(email, { redirectTo }).catch(() => undefined); return msg('Si ese correo tiene una cuenta, te enviamos un enlace para crear una contraseña nueva.', 'ok'); }
    if (mode === 'register') {
      const name = (fd.get('name') || '').trim(); if (!name) return msg('Escribe tu nombre.'); const pe = validatePassword(pw, email); if (pe) return msg(pe); if (!fd.get('ok')) return msg('Para crear tu cuenta acepta los términos y el aviso de privacidad.');
      const r = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: redirectTo, data: { display_name: name, terms_accepted_at: new Date().toISOString(), terms_version: LEGAL_VERSION, guardian_permission_confirmed: true } } });
      if (r.error) return msg(friendly(r.error)); if (!r.data.session) return showAuth('login', 'Te enviamos un correo para confirmar tu cuenta. Después inicia sesión.', 'ok'); return;
    }
    if (!pw) return msg('Escribe tu contraseña.');
    const wait = Math.ceil((S.lockedUntil - Date.now()) / 1000); if (wait > 0) return msg(`Demasiados intentos. Espera ${wait} segundos.`);
    const r = await sb.auth.signInWithPassword({ email, password: pw });
    if (r.error) { S.failures++; S.lockedUntil = Date.now() + cooldownSeconds(S.failures) * 1000; return msg(friendly(r.error)); } S.failures = 0;
  } catch (e) { msg(friendly(e)); } finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}
/* People who sign in with Google/Apple skip the sign-up form, so they must accept the terms before using the app. */
function showConsent() {
  document.body.className = 'noshell'; $('#boot').hidden = true; $('#shell').hidden = true; const a = authBox(); a.hidden = false; const meta = (S.user && S.user.user_metadata) || {};
  a.innerHTML = `<div class="authgrid one"><main class="authmain"><div class="mhead row g12">${LOGO(36)}<strong>StudyFlow MX</strong></div><div class="authcard"><h1>Un paso más${meta.full_name || meta.name ? `, ${esc(String(meta.full_name || meta.name).split(' ')[0])}` : ''}</h1><p class="muted">Antes de empezar, necesitamos tu aceptación.</p>
  <label class="row sw"><input type="checkbox" id="cok"><span class="small">Acepto los <a href="#/legal/terms" target="_blank" rel="noopener">términos</a>, el <a href="#/legal/privacy" target="_blank" rel="noopener">aviso de privacidad</a> y la <a href="#/legal/refunds" target="_blank" rel="noopener">política de cancelación y reembolsos</a>, y soy mayor de edad o tengo permiso de mi mamá, papá o tutor.</span></label><div class="derr" id="cmsg" role="alert"></div><button class="btn lg" data-act="consentOk">Aceptar y continuar</button><button class="btn ghost sm" data-act="consentNo">No acepto, salir</button></div></main></div>`;
}
ACTS.consentOk = async () => {
  if (!$('#cok').checked) return ($('#cmsg').textContent = 'Para continuar acepta los términos y el aviso de privacidad.');
  const stamp = { terms_accepted_at: new Date().toISOString(), terms_version: LEGAL_VERSION, guardian_permission_confirmed: true };
  const r = await sb.auth.updateUser({ data: stamp }); if (r.error) return ($('#cmsg').textContent = friendly(r.error));
  S.user = { ...S.user, user_metadata: { ...(S.user.user_metadata || {}), ...stamp } };
  try { const name = String(S.user.user_metadata.full_name || S.user.user_metadata.name || '').trim().slice(0, 80); const p = await A.profile.get(); if (!p.display_name && name) await A.profile.update({ display_name: name }); } catch { /* the name is optional */ }
  await enter();
};
ACTS.consentNo = async () => { await sb.auth.signOut(); };
function showRecovery() {
  document.body.className = 'noshell'; $('#boot').hidden = true; $('#shell').hidden = true; const a = authBox(); a.hidden = false;
  a.innerHTML = `<div class="authgrid one"><main class="authmain"><div class="mhead row g12">${LOGO(36)}<strong>StudyFlow MX</strong></div><div class="authcard"><h1>Crea tu nueva contraseña</h1><form id="rform" novalidate><p class="muted">Usa al menos 10 caracteres, con letras y números.</p><label>Contraseña nueva<input name="a" type="password" autocomplete="new-password"></label><label>Repite la contraseña<input name="b" type="password" autocomplete="new-password"></label><div class="derr" id="rmsg" role="alert"></div><button class="btn lg">Guardar contraseña</button></form></div></main></div>`;
  $('#rform').addEventListener('submit', async (e) => { e.preventDefault(); const fd = new FormData(e.target), m = $('#rmsg'); const v = validatePassword(fd.get('a') || '', (S.user && S.user.email) || ''); if (v) return (m.textContent = v); if (fd.get('a') !== fd.get('b')) return (m.textContent = 'Las contraseñas no coinciden.');
    const r = await sb.auth.updateUser({ password: fd.get('a') }); if (r.error) return (m.textContent = friendly(r.error)); S.recovery = false; toast('Contraseña actualizada'); await enter(); });
}

/* ---------- SHELL, ROUTER, BOOT ---------- */
const NAV = [['home', 'Inicio', 'home'], ['tasks', 'Tareas', 'tasks'], ['notes', 'Apuntes', 'camera'], ['tutor', CONFIG.TUTOR, 'sparkle'], ['study', 'Estudio', 'cards'], ['profile', 'Perfil', 'user']];
const SIDE_EXTRA = [['focus', 'Enfoque', 'target'], ['premium', 'Premium', 'crown']];
function showShell() { $('#boot').hidden = true; authBox().hidden = true; $('#shell').hidden = false; document.body.className = ''; S.shown = true; }
async function render() {
  const route = (location.hash.replace(/^#\/?/, '') || 'home'); if (/^access_token|type=recovery/.test(route)) return;
  const [view, ...args] = route.split('/'); S.route = route;
  if (view !== 'game' && view !== 'quizedit') { /* keep game state only while inside a game */ if (view !== 'game') S.g = view === 'game' ? S.g : null; }
  if (view !== 'deck') S.sd = null; if (view !== 'onboarding') S.ob = null;
  const group = { game: 'study', deck: 'study', quizedit: 'study' }[view] || view;
  $('#nav').innerHTML = `<div class="brand">${LOGO(30)}<span>StudyFlow MX</span></div>` + [...NAV, ...SIDE_EXTRA.map((x) => [...x, 'side'])].map(([k, l, i, side]) => `<button class="${side ? 'sideonly' : ''}" data-act="go" data-v="${k}" ${group === k ? 'aria-current="page"' : ''}>${ico(i, 22)}<span>${esc(l)}</span></button>`).join('');
  const main = $('#main'), fn = VIEWS[view] || VIEWS.home; AFTER.length = 0;
  const searchFocused = document.activeElement && document.activeElement.id === 'q';
  if (!main.firstChild || S.lastView !== view) main.innerHTML = `<div class="page">${loadingHtml}</div>`; S.lastView = view;
  try { const html = await fn(args); if (S.route !== route) return; main.innerHTML = `<div class="page">${html}${legalFooter()}</div>`; if (searchFocused) { const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } } for (const f of AFTER.splice(0)) f(); }
  catch (e) { main.innerHTML = `<div class="page">${errHtml(friendly(e))}</div>`; }
}
ACTS.go = (el) => { location.hash = '#/' + el.dataset.v; };
async function checkOnboarded() { const r = await sb.from('study_profiles').select('user_id').maybeSingle(); return r.error ? true : !!r.data; } // fails open: never lock anyone out
async function enter() {
  if (!((S.user && S.user.user_metadata) || {}).terms_accepted_at) return showConsent();
  try { S.onboarded = await checkOnboarded(); } catch { S.onboarded = true; }
  A.profile.touch().catch(() => undefined); showShell();
  if (S.onboarded === false && !/^#\/onboarding/.test(location.hash)) location.hash = '#/onboarding'; else render();
}
async function onAuth(event, session) {
  if (event === 'PASSWORD_RECOVERY') { S.recovery = true; S.user = session ? session.user : null; return showRecovery(); }
  if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') return;
  const user = session ? session.user : null;
  if (event === 'SIGNED_IN' && S.user && user && S.user.id === user.id && S.shown) return; // tab regained focus
  S.bootDone = true; S.user = user; if (!user) { if (!/^#\/legal\//.test(location.hash)) history.replaceState(null, '', location.pathname + location.search); S.shown = false; S.profile = S.method = null; S.onboarded = null; clearUserState(); return showAuth(); }
  if (S.recovery) return; await enter();
}
/* Privacy on shared devices: nothing from the previous person (chat, search, selections, game state) survives sign-out. */
function clearUserState() { S.authMode = 'login'; S.tf = { status: 'pending', search: '' }; S.nsel = new Set(); S.nsub = null; S.chat = { msgs: [], files: [], busy: false, problem: null }; S.gc = S.g = S.sd = S.ob = null; S.subjects = S.taskCache = S.examCache = S.deckCards = S.notesCache = S.editQs = S.quota = null; S.cal = { y: new Date().getFullYear(), m: new Date().getMonth(), sel: today() }; clearInterval(S.tick); S.timer = { phase: 'idle', start: 0, end: 0 }; const m = $('#main'); if (m) m.innerHTML = ''; S.lastView = null; }
function legacyPath() { const p = location.pathname.replace(/\/index\.html$/, ''); if (/\/premium\/?$/.test(p)) { history.replaceState(null, '', location.pathname.replace(/premium\/?$/, '') + location.search + '#/premium'); } }
document.addEventListener('click', (e) => { const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; const fn = ACTS[t.dataset.act]; if (fn) { e.preventDefault(); Promise.resolve(fn(t, e)).catch((er) => toast(friendly(er), 'err')); } });
document.addEventListener('change', (e) => { if (e.target.matches && e.target.matches('input[type=file][data-file]')) handleNoteFile(e.target); });
let qTimer; document.addEventListener('input', (e) => { if (e.target.id === 'q') { clearTimeout(qTimer); qTimer = setTimeout(() => { S.tf.search = e.target.value.slice(0, 80); render(); }, 300); } });
document.addEventListener('keydown', (e) => { if (e.target.id === 'chatin' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ACTS.chatSend(); } });
window.addEventListener('hashchange', () => { if (S.user && S.shown) render(); else if (!S.user && S.bootDone && !S.recovery) { const m = location.hash.match(/^#\/legal\/(\w+)/); if (m) showLegalPage(m[1]); } });
const loadScript = (url) => new Promise((res) => { const el = document.createElement('script'); el.src = url; el.crossOrigin = 'anonymous'; el.onload = () => res(true); el.onerror = () => res(false); document.head.appendChild(el); });
async function boot() {
  // If the pinned library did not load, try the CDN's latest 2.x once before giving up.
  if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
  if (!window.supabase || !window.supabase.createClient) { $('#boot').innerHTML = '<div class="card center"><p>No se pudo cargar la librería de la app. Revisa tu internet y recarga la página.</p></div>'; return; }
  legacyPath();
  sb = window.supabase.createClient(CONFIG.URL, CONFIG.KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => onAuth(event, session).catch((er) => toast(friendly(er), 'err')), 0); });
}
boot();
